<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Archiver</title>
    <style>
        body {
            background-color: #3e3e3e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 16px;
        }

        /* Prevent background scrolling when dialog is open */
        body.dialog-open {
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        h1 {
            margin: 0;
        }

        h2 {
            font-size: 16px;
            font-weight: 400;
        }

        input[type="search"] {
            height: fit-content;
            padding: 0.5em;
            background-color: #272727;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }

        .btn {
            background-color: #272727;
            color: #ffffff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;

            &:hover:not(:disabled) {
                background-color: #000;
            }

            &:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
        }

        /* Styles for Import Popover Dialog */
        #import-dialog {
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #555;
            width: 480px;
            max-width: 90vw;
            background-color: #2b2b2b;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            outline: none;
        }

        #import-dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.65);
        }

        .step-container {
            margin-bottom: 20px;
        }

        .step-container h3 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        .hidden {
            display: none !important;
        }

        #log-container {
            background: #181818;
            color: #00ff66;
            padding: 10px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            margin-top: 10px;
        }

        progress {
            width: 100%;
            height: 16px;
            margin-bottom: 6px;
        }

        .log-entry {
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 4px;
            padding-bottom: 2px;
            word-break: break-all;
        }

        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>TikTok Archiver</h1>
        <div class="header-actions">
            <input type="search" id="search-input" placeholder="Wpisz frazę..." />
            <button class="btn" id="random-btn">🎲 Losuj</button>
            <button class="btn" popovertarget="import-dialog">Otwórz Import</button>
        </div>
    </header>

    <main></main>

    <!-- POPOVER IMPORT DIALOG -->
    <div id="import-dialog" popover>
        <div id="step-1" class="step-container">
            <h3>1. Ciasteczka (.txt)</h3>
            <input type="file" id="cookies-file-input" accept=".txt" />
        </div>

        <div id="step-2" class="step-container hidden">
            <h3>2. JSON TikTok</h3>
            <input type="file" id="json-file-input" accept=".json" />
        </div>

        <div id="step-3" class="step-container hidden">
            <h3>3. Pobieranie</h3>
            <progress id="main-progress" value="0" max="100"></progress>
            <div id="progress-text">Przygotowanie...</div>
            <div id="log-container"></div>
        </div>

        <div class="dialog-footer">
            <button class="btn" popovertarget="import-dialog" popovertargetaction="hide">Zamknij</button>
        </div>
    </div>

    <script type="module">
        import {LitElement, html, render, css} from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
        const ROOT_URL = 'http://localhost:3000';
        const BASE_URL = 'http://127.0.0.1:3000';
        
        class TikTokTable extends LitElement {
            static properties = {
                activeItem: { type: Object },
                activeItemIndex: { type: Number },
                activePhotoIndex: { type: Number },
                items: { type: Array },
                page: { type: Number },
                pageSize: { type: Number },
                savedVolume: { type: Number },
                downloadingIds: { type: Object },
                copiedStatus: { type: Boolean },
                searchQuery: { type: String }
            };

            static styles = css`
                table img {
                    max-width: 100px;
                }

                a {
                    color: #ffffff;
                }
                
                table {
                    width: 100%;
                    border-collapse: collapse;
                }

                th {
                    text-align: left;
                    padding: 8px;
                }

                td {
                    padding: 8px;
                }

                @keyframes milestoneGlow {
                    0% { background-color: rgba(255, 215, 0, 0.0); }
                    50% { background-color: rgba(255, 215, 0, 0.25); }
                    100% { background-color: rgba(255, 215, 0, 0.0); }
                }

                .milestone-row {
                    animation: milestoneGlow 2.5s ease-in-out infinite;
                }

                button:has(img) {
                    background: transparent;
                    padding: 0;
                    border: none;
                    cursor: pointer;  
                }

                .pagination {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin: 16px 0;
                    gap: 12px;
                    flex-wrap: wrap;
                }

                .pagination-controls {
                    display: flex;
                    gap: 8px;
                    align-items: center;
                }

                .pagination button {
                    background-color: #272727;
                    color: #ffffff;
                    border: 1px solid #555;
                    padding: 6px 12px;
                    border-radius: 4px;
                    cursor: pointer;

                    &:hover:not(:disabled) {
                        background-color: #000;
                    }

                    &:disabled {
                        opacity: 0.5;
                        cursor: not-allowed;
                    }
                }

                .pagination select {
                    background-color: #272727;
                    color: #ffffff;
                    border: 1px solid #555;
                    padding: 6px;
                    border-radius: 4px;
                }

                dialog {
                    height: 90vh;
                    width: 900px;
                    max-width: 95%;
                    display: flex;
                    gap: 24px;             
                    background-color: #353333;
                    color: #fff;
                    border: 0;
                    outline: none;

                    &:not([open]) {
                        display: none;
                    }

                    video, figure, .media-error {
                        width: 50%;
                        margin: 0;
                    }

                    .media-error {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        background-color: #222;
                        border-radius: 8px;
                        padding: 24px;
                        text-align: center;

                        p {
                            margin: 12px 0;
                            color: #aaa;
                        }

                        button {
                            width: auto;
                            padding: 8px 16px;
                            border-radius: 4px;
                            font-size: 14px;
                        }

                        button:disabled {
                            opacity: 0.5;
                            cursor: not-allowed;
                        }
                    }

                    figure {
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        position: relative;
                        
                        img {
                            width: 100%;
                            max-height: 80vh;
                            object-fit: contain;
                        }

                        button {
                            position: absolute;
                            top: 50%;
                            transform: translateY(-50%);
                            opacity: 0.7;

                            &.left {
                                left: 0;
                            }

                            &.right {
                                right: 0;
                            }
                        }
                    }

                    figcaption {
                        text-align: center;
                    }

                    article {
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        overflow-y: auto;
                    }

                    dt {
                        color: #d0cfcf;
                    }

                    dd {
                        margin: 0 0 24px;
                        word-break: break-word;
                    }

                    .controls {
                        display: flex;
                        justify-content: space-between;
                        margin-bottom: 16px;
                    }

                    .copy-btn {
                        background-color: #272727;
                        color: #ffffff;
                        border: 1px solid #555;
                        padding: 4px 10px;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 12px;
                        margin-left: 8px;
                        vertical-align: middle;

                        &:hover {
                            background-color: #000;
                        }
                    }

                    .nav-btn {
                        cursor: pointer;
                        color: #ffffff;
                        border: 0;
                        font-size: 24px;
                        background-color: #272727;
                        height: 40px;
                        width: 40px;
                        border-radius: 50px;

                        &:hover {
                            background-color: #000000;
                        }

                        &.close {
                            height: 32px;
                            width: 32px;
                            font-size: 16px;
                        }
                    }

                    audio {
                        width: 100%;
                        margin-top: auto;
                    }
                }

                ::backdrop {
                    background-color: rgb(0, 0, 0, 65%);
                }
            `

            constructor() {
                super()
                this.items = []
                this.page = 1
                
                const storedPageSize = localStorage.getItem('pageSize')
                this.pageSize = storedPageSize !== null ? Number(storedPageSize) : 50

                this.activeItem = null
                this.activeItemIndex = -1
                this.activePhotoIndex = 0
                this.downloadingIds = {}
                this.copiedStatus = false
                this.searchQuery = ''

                const storedVol = localStorage.getItem('mediaVolume')
                this.savedVolume = storedVol !== null ? parseFloat(storedVol) : 1.0

                this.handleKeyDown = this.handleKeyDown.bind(this)
                this.handleWheel = this.handleWheel.bind(this)

                this.fetchData()
            }

            connectedCallback() {
                super.connectedCallback();
                window.addEventListener('keydown', this.handleKeyDown);
            }

            disconnectedCallback() {
                super.disconnectedCallback();
                window.removeEventListener('keydown', this.handleKeyDown);
            }

            handleKeyDown(e) {
                if (!this.activeItem) return;

                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    this.showPreviousItem();
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    this.showNextItem();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (this.activeItem.type === 'photo' && this.hasValidPhotos(this.activeItem)) {
                        this.showPreviousPhoto();
                    } else {
                        this.showPreviousItem();
                    }
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (this.activeItem.type === 'photo' && this.hasValidPhotos(this.activeItem)) {
                        this.showNextPhoto();
                    } else {
                        this.showNextItem();
                    }
                }
            }

            handleWheel(e) {
                if (!this.activeItem) return;
                e.preventDefault();

                if (e.deltaY < 0) {
                    this.showPreviousItem();
                } else if (e.deltaY > 0) {
                    this.showNextItem();
                }
            }

            async fetchData() {
                try {
                    const response = await fetch(ROOT_URL + '/tiktoks')
                    const tiktoks = await response.json()
                    tiktoks.sort((a, b) => new Date(b.date) - new Date(a.date))
                    this.items = tiktoks

                    if (this.activeItem) {
                        const updatedActive = this.items.find(i => i.id === this.activeItem.id)
                        if (updatedActive) {
                            this.activeItem = updatedActive
                            this.activeItemIndex = this.filteredItems.findIndex(i => i.id === updatedActive.id)
                            this.clampPhotoIndex();
                        }
                    }
                } catch (err) {
                    console.error('Błąd podczas pobierania danych:', err)
                }
            }

            updated(changedProperties) {
                if (changedProperties.has('activeItem') && this.activeItem) {
                    this.clampPhotoIndex();
                    if (this.activeItem.type === 'video' && this.activeItem.content) {
                        const videoEl = this.renderRoot.querySelector('video');
                        if (videoEl) {
                            videoEl.load();
                            videoEl.play().catch(() => {});
                        }
                    } else if (this.activeItem.type === 'photo' && this.hasValidPhotos(this.activeItem)) {
                        const audioEl = this.renderRoot.querySelector('audio');
                        if (audioEl) {
                            audioEl.load();
                            audioEl.play().catch(() => {});
                        }
                    }
                }
            }

            getValidPhotos(item) {
                if (!item || !Array.isArray(item.content)) return [];
                return item.content.filter(Boolean);
            }

            hasValidPhotos(item) {
                return this.getValidPhotos(item).length > 0;
            }

            clampPhotoIndex() {
                if (this.activeItem && this.activeItem.type === 'photo') {
                    const photos = this.getValidPhotos(this.activeItem);
                    if (photos.length === 0) {
                        this.activePhotoIndex = 0;
                    } else if (this.activePhotoIndex >= photos.length) {
                        this.activePhotoIndex = photos.length - 1;
                    }
                }
            }

            get filteredItems() {
                if (!this.searchQuery.trim()) return this.items;
                const q = this.searchQuery.toLowerCase().trim();
                return this.items.filter(item => {
                    const descMatch = item.description ? item.description.toLowerCase().includes(q) : false;
                    const userMatch = item.username ? item.username.toLowerCase().includes(q) : false;
                    return descMatch || userMatch;
                });
            }

            get totalPages() {
                return Math.ceil(this.filteredItems.length / this.pageSize) || 1
            }

            get paginatedItems() {
                const start = (this.page - 1) * this.pageSize
                const end = start + this.pageSize
                return this.filteredItems.slice(start, end)
            }

            handleVolumeChange(e) {
                const mediaEl = e.currentTarget
                this.savedVolume = mediaEl.volume
                localStorage.setItem('mediaVolume', mediaEl.volume)
            }

            goToPage(newPage) {
                if (newPage >= 1 && newPage <= this.totalPages) {
                    this.page = newPage
                    window.scrollTo({ top: 0, behavior: 'smooth' })
                }
            }

            handlePageSizeChange(e) {
                this.pageSize = Number(e.target.value)
                localStorage.setItem('pageSize', this.pageSize)
                this.page = 1
                window.scrollTo({ top: 0, behavior: 'smooth' })
            }

            openRandomItem() {
                const list = this.filteredItems;
                if (!list || list.length === 0) {
                    alert("Brak elementów do wylosowania.");
                    return;
                }
                const randomIndex = Math.floor(Math.random() * list.length);
                const randomItem = list[randomIndex];
                
                this.showItemContent(randomItem);

                const dialog = this.renderRoot.querySelector('#content-dialog');
                if (dialog && !dialog.open) {
                    dialog.showModal();
                }
            }

            async downloadMissingTikTok(item) {
                if (this.downloadingIds[item.id]) return;

                this.downloadingIds = { ...this.downloadingIds, [item.id]: true };

                try {
                    await fetch(`${ROOT_URL}/download`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: item.id,
                            fullUrl: item.fullUrl,
                            type: item.type,
                            fallback: true
                        })
                    });

                    await new Promise((resolve) => {
                        const eventSource = new EventSource(`${ROOT_URL}/progress/${item.id}`);

                        eventSource.onmessage = (event) => {
                            try {
                                const pData = JSON.parse(event.data);
                                if (pData && typeof pData === 'object' && pData.type === 'complete') {
                                    eventSource.close();
                                    resolve();
                                }
                            } catch (e) {}
                        };

                        eventSource.onerror = () => {
                            eventSource.close();
                            resolve();
                        };
                    });

                    await this.fetchData();

                } catch (err) {
                    console.error('Błąd pobierania:', err);
                } finally {
                    const updatedDownloading = { ...this.downloadingIds };
                    delete updatedDownloading[item.id];
                    this.downloadingIds = updatedDownloading;
                }
            }

            copyLinkToClipboard(url) {
                if (!url) return;

                const performCopy = async () => {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(url);
                    } else {
                        const textArea = document.createElement("textarea");
                        textArea.value = url;
                        textArea.style.position = "fixed";
                        textArea.style.left = "-999999px";
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                };

                performCopy().then(() => {
                    this.copiedStatus = true;
                    setTimeout(() => {
                        this.copiedStatus = false;
                    }, 2000);
                }).catch(err => {
                    console.error('Błąd kopiowania linku:', err);
                });
            }

            renderPagination() {
                return html`
                    <div class="pagination">
                        <div>
                            Strona ${this.page} z ${this.totalPages} (${this.filteredItems.length} pozycji)
                        </div>

                        <div class="pagination-controls">
                            <button 
                                ?disabled=${this.page === 1} 
                                @click=${() => this.goToPage(1)}>
                                «
                            </button>
                            <button 
                                ?disabled=${this.page === 1} 
                                @click=${() => this.goToPage(this.page - 1)}>
                                Poprzednia
                            </button>
                            
                            <button 
                                ?disabled=${this.page === this.totalPages} 
                                @click=${() => this.goToPage(this.page + 1)}>
                                Następna
                            </button>
                            <button 
                                ?disabled=${this.page === this.totalPages} 
                                @click=${() => this.goToPage(this.totalPages)}>
                                »
                            </button>

                            <select .value=${String(this.pageSize)} @change=${this.handlePageSizeChange}>
                                <option value="25">25 na stronę</option>
                                <option value="50">50 na stronę</option>
                                <option value="100">100 na stronę</option>
                                <option value="250">250 na stronę</option>
                            </select>
                        </div>
                    </div>
                `
            }

            render() {
                return html`
                    <table>
                        <thead>
                            <th>Miniatura</th>
                            <th>Kolejność</th>
                            <th>Data polubienia</th>
                            <th>Link</th>
                            <th>Autor</th>
                            <th>Opis</th>
                        </thead>
                        <tbody>
                            ${this.paginatedItems.map(item => {
                                const order = this.items.length - (this.items.findIndex(i => i.id === item.id))
                                const isMilestone = order > 0 && order % 100 === 0
                                return html`
                                    <tr class="${isMilestone ? 'milestone-row' : ''}">
                                        <td>${this.renderThumbnail(item)}</td>
                                        <td>${this.renderOrder(item)}</td>
                                        <td>${this.renderDate(item)}</td>
                                        <td>${this.renderLink(item)}</td>
                                        <td>${this.renderAuthor(item)}</td>
                                        <td>${this.renderDescription(item)}</td>
                                    </tr>
                                `
                            })}
                        </tbody>
                    </table>

                    ${this.renderPagination()}

                    <dialog id="content-dialog" @wheel=${this.handleWheel} @close=${this.resetItemContent} @cancel=${this.resetItemContent}>
                        ${this.renderDialogContent()}
                    </dialog>
                `
            }

            renderThumbnail(item) {
                const isDownloading = !!this.downloadingIds[item.id]

                if (item.cover && !item.cover.endsWith('undefined')) {
                    return html`
                        <button class="thumbnailButton" command="show-modal" commandfor="content-dialog" @click=${() => this.showItemContent(item)}>
                            <img src="${ROOT_URL + '/cover/' + item.id}" alt="${item.description}" loading="lazy" />
                        </button>
                    `
                } else {
                    return html`
                        <button class="btn" ?disabled=${isDownloading} @click=${() => this.downloadMissingTikTok(item)}>
                            ${isDownloading ? 'Pobieranie...' : 'Pobierz'}
                        </button>
                    `
                }
            }
            
            renderOrder(item) {
                const order = this.items.length - (this.items.findIndex(i => i.id === item.id))
                return html`${order}`
            }

            renderDate(item) {
                if (item.date) {
                    const formattedDate = Intl.DateTimeFormat("pl-PL").format(new Date(item.date))
                    return html`<time datetime=${item.date}>${formattedDate}</time>`
                } else {
                    return ''
                }
            }

            renderLink(item) {
                if (item.fullUrl) {
                    return html`<a href="${item.fullUrl}" target="_blank">${item.fullUrl}</a>`
                } else {
                    return ''
                }
            }

            renderAuthor(item) {
                if (item.username) {
                    return html`<a href="${'https://www.tiktok.com/@' + item.username}" target="_blank">${item.username}</a>`
                } else {
                    return ''
                }
            }

            renderDescription(item) {
                return item.description || ''
            }

            renderDialogContent() {
                if (!this.activeItem) return ''
                return html`
                    ${this.renderDialogMultimedia()}
                    ${this.renderDialogMetadata()}
                `
            }

            renderDialogMultimedia() {
                if (this.activeItem.type === 'video') {
                    if (!this.activeItem.content) {
                        return this.renderMissingMediaPlaceholder()
                    }
                    return html`
                        <video 
                            src="${ROOT_URL + this.activeItem.content}"
                            controls 
                            autoplay 
                            loop 
                            .volume=${this.savedVolume}
                            @volumechange=${this.handleVolumeChange}>
                        </video>
                    `
                } else {
                    const validPhotos = this.getValidPhotos(this.activeItem);
                    if (validPhotos.length === 0) {
                        return this.renderMissingMediaPlaceholder();
                    }

                    const totalPhotos = validPhotos.length;
                    return html`
                        <figure>
                            <img src="${ROOT_URL + '/images/' + this.activeItem.id + "/" + (this.activePhotoIndex + 1)}" />
                            <figcaption>${this.activePhotoIndex + 1} z ${totalPhotos}</figcaption>
                            ${totalPhotos > 1 ? html`
                                <button class="nav-btn left" @click=${this.showPreviousPhoto}>&#x3c;</button>
                                <button class="nav-btn right" @click=${this.showNextPhoto}>&#x3e;</button>
                            ` : ''}
                        </figure>
                    `
                }
            }

            renderMissingMediaPlaceholder() {
                const isDownloading = !!this.downloadingIds[this.activeItem.id]

                return html`
                    <div class="media-error">
                        ⚠️
                        <p>Brak pobranych multimediów dla tego wpisu.</p>
                        <button class="btn" ?disabled=${isDownloading} @click=${() => this.downloadMissingTikTok(this.activeItem)}>
                            ${isDownloading ? 'Pobieranie...' : 'Pobierz ponownie'}
                        </button>
                    </div>
                `
            }

            renderDialogMetadata() {
                const hasPhotos = this.hasValidPhotos(this.activeItem)
                const audioControls = this.activeItem.type === 'photo' && hasPhotos ?
                    html`
                        <audio 
                            src="${ROOT_URL + '/audio/' + this.activeItem.id}"
                            controls 
                            autoplay 
                            loop 
                            .volume=${this.savedVolume}
                            @volumechange=${this.handleVolumeChange}>
                        </audio>
                    ` : ''

                return html`
                    <article>
                        <div class="controls">
                            <div>
                                <button class="nav-btn" @click=${this.showPreviousItem}>↑</button>
                                <button class="nav-btn" @click=${this.showNextItem}>↓</button>
                            </div>
                            <button class="nav-btn close" commandfor="content-dialog" command="close">X</button>
                        </div>
                        <dl>
                            <dt>Kolejność</dt>
                            <dd>${this.renderOrder(this.activeItem)}</dd>

                            <dt>Autor</dt>
                            <dd>${this.renderAuthor(this.activeItem)}</dd>
            
                            <dt>
                                Link 
                                ${this.activeItem.fullUrl ? html`
                                    <button class="copy-btn" @click=${() => this.copyLinkToClipboard(this.activeItem.fullUrl)}>${this.copiedStatus ? 'Skopiowano!' : 'Kopiuj link'}
                                    </button>
                                ` : ''}
                            </dt>
                            <dd>${this.renderLink(this.activeItem)}</dd>
            
                            <dt>Data polubienia</dt>
                            <dd>${this.renderDate(this.activeItem)}</dd>

                            <dt>Opis</dt>
                            <dd>${this.renderDescription(this.activeItem)}</dd>
                        </dl>
                        ${audioControls}
                    </article>
                `
            }

            showItemContent(item) {
                this.activeItem = item
                this.activeItemIndex = this.filteredItems.findIndex(i => i.id === item.id)
                this.activePhotoIndex = 0
                this.copiedStatus = false

                document.body.classList.add('dialog-open')

                if (this.activeItemIndex !== -1) {
                    const expectedPage = Math.floor(this.activeItemIndex / this.pageSize) + 1
                    if (this.page !== expectedPage) {
                        this.page = expectedPage
                    }
                }
            }

            showPreviousItem() {
                if (this.activeItemIndex > 0) {
                    this.showItemContent(this.filteredItems[this.activeItemIndex - 1])
                }
            }

            showNextItem() {
                if (this.activeItemIndex + 1 < this.filteredItems.length) {
                    this.showItemContent(this.filteredItems[this.activeItemIndex + 1])
                }
            }

            showPreviousPhoto() {
                const validPhotos = this.getValidPhotos(this.activeItem);
                if (validPhotos.length <= 1) return;

                if (this.activePhotoIndex <= 0) {
                    this.activePhotoIndex = validPhotos.length - 1;
                } else {
                    this.activePhotoIndex -= 1;
                }
            }

            showNextPhoto() {
                const validPhotos = this.getValidPhotos(this.activeItem);
                if (validPhotos.length <= 1) return;

                if (this.activePhotoIndex >= validPhotos.length - 1) {
                    this.activePhotoIndex = 0;
                } else {
                    this.activePhotoIndex += 1;
                }
            }

            resetItemContent() {
                this.activeItem = null
                this.activeItemIndex = -1
                this.activePhotoIndex = 0
                this.copiedStatus = false
                document.body.classList.remove('dialog-open')
            }
        }

        const fetchLastLikeDate = async () => {
            try {
                const res = await fetch(ROOT_URL + '/last-like')
                return await res.text()
            } catch (err) {
                return 'Brak danych'
            }
        }

        const renderHeaderInfo = async () => {
            const lastLike = await fetchLastLikeDate()
            return html`<h2 id="last-like-header">Ostatnia modyfikacja: ${lastLike}</h2>`
        } 

        const prepareMainContent = async () => {
            return html`${await renderHeaderInfo()} <tiktok-table id="main-table"></tiktok-table>`
        }

        customElements.define('tiktok-table', TikTokTable);
        
        render(await prepareMainContent(), document.querySelector('main'))

        // Wire up Search Input
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
            const tableEl = document.querySelector('tiktok-table');
            if (tableEl) {
                tableEl.searchQuery = e.target.value;
                tableEl.page = 1; // Reset to first page when filtering
            }
        });

        // Wire up Random Button
        const randomBtn = document.getElementById('random-btn');
        randomBtn.addEventListener('click', () => {
            const tableEl = document.querySelector('tiktok-table');
            if (tableEl) {
                tableEl.openRandomItem();
            }
        });

        // --- WRITING / IMPORT MECHANISM CODE ---
        const cookiesInput = document.getElementById('cookies-file-input');
        const jsonInput = document.getElementById('json-file-input');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const logContainer = document.getElementById('log-container');
        const progressBar = document.getElementById('main-progress');
        const progressText = document.getElementById('progress-text');

        function addLog(msg) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // --- KROK 1: COOKIES ---
        cookiesInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const content = await file.text();
            const resp = await fetch(`${BASE_URL}/cookies`, { method: 'POST', body: content });
            if (resp.ok) {
                cookiesInput.disabled = true;
                step2.classList.remove('hidden');
            }
        });

        // --- KROK 2 & 3: PRZETWARZANIE JSON I POBIERANIE ---
        jsonInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const lastLikeResp = await fetch(`${BASE_URL}/last-like`);
                const lastLikeDateStr = (await lastLikeResp.text()).trim();
                const lastLikeDate = new Date(lastLikeDateStr);

                const data = JSON.parse(await file.text());
                const allLikes = data["Likes and Favorites"]["Like List"]["ItemFavoriteList"];
                const filteredLikes = allLikes.filter(item => new Date(item.date) > lastLikeDate);

                if (filteredLikes.length === 0) return alert("Brak nowych polubień.");

                step3.classList.remove('hidden');
                jsonInput.disabled = true;

                // Przetwarzanie sekwencyjne
                for (let i = 0; i < filteredLikes.length; i++) {
                    const item = filteredLikes[i];
                    const currentIdx = i + 1;
                    
                    // Aktualizacja paska postępu
                    progressBar.value = (currentIdx / filteredLikes.length) * 100;
                    progressText.textContent = `Przetwarzanie ${currentIdx} z ${filteredLikes.length}...`;

                    addLog(`Pobieranie metadanych: ${item.link}`);

                    // 1. Pobierz Metadane
                    const metaResp = await fetch(`${BASE_URL}/metadata`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: item.link, date: item.date })
                    });
                    const metaData = await metaResp.json();

                    if (!metaData || !metaData.id) {
                        addLog(`BŁĄD: Nie udało się pobrać metadanych dla ${item.link}`);
                        continue;
                    }

                    // 2. Uruchom Download
                    addLog(`Start downloadu ID: ${metaData.id}`);
                    await fetch(`${BASE_URL}/download`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: metaData.id, fullUrl: item.link, type: metaData.type })
                    });

                    // 3. SSE Progress - Czekaj na zakończenie elementu
                    await new Promise((resolve) => {
                        const eventSource = new EventSource(`${BASE_URL}/progress/${metaData.id}`);
                        
                        eventSource.onmessage = (event) => {
                            try {
                                const pData = JSON.parse(event.data);
                                
                                if (pData && typeof pData === 'object' && pData.type === 'complete') {
                                    addLog(`✅ ZAKOŃCZONO: ${metaData.id}`);
                                    eventSource.close();
                                    resolve();
                                } else {
                                    const logMsg = typeof pData === 'string' ? pData : JSON.stringify(pData);
                                    addLog(`[System]: ${logMsg}`);
                                }
                            } catch (e) {
                                addLog(`[Raw]: ${event.data}`);
                            }
                        };

                        eventSource.onerror = (err) => {
                            if (eventSource.readyState === EventSource.CLOSED) {
                                addLog(`Stream zamknięty dla ${metaData.id}`);
                                resolve();
                            } else {
                                addLog(`⚠️ Błąd połączenia SSE (ID: ${metaData.id}). Próba ponownego połączenia...`);
                                eventSource.close();
                                resolve();
                            }
                        };
                    });
                }

                const latestDate = filteredLikes[0].date;

                addLog(`Aktualizowanie daty granicznej na: ${latestDate}...`);

                await fetch(`${BASE_URL}/last-like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: latestDate
                });
                
                addLog("WSZYSTKIE ZADANIA UKOŃCZONE!");
                alert("Import zakończony!");

                // Odświeżenie danych na stronie po zakończeniu importu
                const tableEl = document.querySelector('tiktok-table');
                if (tableEl && typeof tableEl.fetchData === 'function') {
                    tableEl.fetchData();
                }

                const lastLikeHeader = document.getElementById('last-like-header');
                if (lastLikeHeader) {
                    const newLastLike = await fetchLastLikeDate();
                    lastLikeHeader.textContent = `Ostatnia modyfikacja: ${newLastLike}`;
                }

            } catch (err) {
                addLog(`KRYTYCZNY BŁĄD: ${err.message}`);
            }
        });
    </script>
</body>
</html>
