<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Archiver</title>
    <style>
        body {
            background-color: #3e3e3e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
        }

        h2 {
            font-size: 16px;
            font-weight: 400;
        }

        input[type="search"] {
            height: fit-content;
            padding: 0.5em
        }
    </style>
</head>
<body>
    <header>
        <h1>TikTok Archiver</h1>
        <input type="search" placeholder="Wpisz frazę" />
    </header>

    <main></main>

    <script type="module">
        import {LitElement, html, render, css} from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
        const ROOT_URL = 'http://localhost:3000'
        const ROOT_ASSETS_URL = ROOT_URL + '/assets'
        
        class TikTokTable extends LitElement {
            static properties = {
                activeItem: { type: Object },
                activeItemIndex: { type: Number },
                activePhotoIndex: { type: Number },
                items: { type: Array },
                page: { type: Number },
                pageSize: { type: Number },
                savedVolume: { type: Number },
            };

            static styles = css`
                table img {
                    max-width: 100px;
                }

                a {
                    color: #ffffff;
                }
                
                table {
                    width: 100%;
                    border-collapse: collapse;
                }

                th {
                    text-align: left;
                    padding: 8px;
                }

                td {
                    padding: 8px;
                }

                button:has(img) {
                    background: transparent;
                    padding: 0;
                    border: none;
                    cursor: pointer;  
                }

                .pagination {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin: 16px 0;
                    gap: 12px;
                    flex-wrap: wrap;
                }

                .pagination-controls {
                    display: flex;
                    gap: 8px;
                    align-items: center;
                }

                .pagination button {
                    background-color: #272727;
                    color: #ffffff;
                    border: 1px solid #555;
                    padding: 6px 12px;
                    border-radius: 4px;
                    cursor: pointer;

                    &:hover:not(:disabled) {
                        background-color: #000;
                    }

                    &:disabled {
                        opacity: 0.5;
                        cursor: not-allowed;
                    }
                }

                .pagination select {
                    background-color: #272727;
                    color: #ffffff;
                    border: 1px solid #555;
                    padding: 6px;
                    border-radius: 4px;
                }

                dialog {
                    height: 90vh;
                    width: 900px;
                    max-width: 95%;
                    display: flex;
                    gap: 24px;             
                    background-color: #353333;
                    color: #fff;
                    border: 0;

                    &:not([open]) {
                        display: none;
                    }

                    video, figure {
                        width: 50%;
                        margin: 0;
                    }

                    figure {
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        position: relative;
                        
                        img {
                            width: 100%;
                        }

                        button {
                            position: absolute;
                            top: 50%;
                            transform: translateY(-50%);
                            opacity: 0.7;

                            &.left {
                                left: 0;
                            }

                            &.right {
                                right: 0;
                            }
                        }
                    }

                    figcaption {
                        text-align: center;
                    }

                    dt {
                        color: #d0cfcf;
                    }

                    dd {
                        margin: 0 0 24px;
                        word-break: break-word;
                    }

                    .controls {
                        display: flex;
                        justify-content: space-between;
                    }

                    button {
                        cursor: pointer;
                        color: #ffffff;
                        border: 0;
                        font-size: 24px;
                        background-color: #272727;
                        height: 40px;
                        width: 40px;
                        border-radius: 50px;

                        &:hover {
                            background-color: #000000;
                        }

                        &.close {
                            height: 32px;
                            width: 32px;
                            font-size: 16px
                        }
                    }

                    audio {
                        width: 100%;
                    }
                }
                    
                ::backdrop {
                    background-color: rgb(0, 0, 0, 65%);
                }
            `

            constructor() {
                super()
                this.items = []
                this.page = 1
                this.pageSize = 50
                this.activeItem = null
                this.activeItemIndex = -1
                this.activePhotoIndex = 0

                const storedVol = localStorage.getItem('mediaVolume')
                this.savedVolume = storedVol !== null ? parseFloat(storedVol) : 1.0

                fetch(ROOT_URL + '/tiktoks')
                    .then(response => response.json())
                    .then(tiktoks => tiktoks.sort((a, b) => new Date(b.date) - new Date(a.date)))
                    .then(tiktoks => {
                        this.items = tiktoks
                    })
            }

            updated(changedProperties) {
                if (changedProperties.has('activeItem') && this.activeItem) {
                    if (this.activeItem.type === 'video') {
                        const videoEl = this.renderRoot.querySelector('video');
                        if (videoEl) {
                            videoEl.load();
                            videoEl.play().catch(() => {});
                        }
                    } else if (this.activeItem.type === 'photo') {
                        const audioEl = this.renderRoot.querySelector('audio');
                        if (audioEl) {
                            audioEl.load();
                            audioEl.play().catch(() => {});
                        }
                    }
                }
            }

            get totalPages() {
                return Math.ceil(this.items.length / this.pageSize) || 1
            }

            get paginatedItems() {
                const start = (this.page - 1) * this.pageSize
                const end = start + this.pageSize
                return this.items.slice(start, end)
            }

            handleVolumeChange(e) {
                const mediaEl = e.currentTarget
                this.savedVolume = mediaEl.volume
                localStorage.setItem('mediaVolume', mediaEl.volume)
            }

            goToPage(newPage) {
                if (newPage >= 1 && newPage <= this.totalPages) {
                    this.page = newPage
                    window.scrollTo({ top: 0, behavior: 'smooth' })
                }
            }

            handlePageSizeChange(e) {
                this.pageSize = Number(e.target.value)
                this.page = 1
                window.scrollTo({ top: 0, behavior: 'smooth' })
            }

            renderPagination() {
                return html`
                    <div class="pagination">
                        <div>
                            Strona ${this.page} z ${this.totalPages} (${this.items.length} pozycji)
                        </div>

                        <div class="pagination-controls">
                            <button 
                                ?disabled=${this.page === 1} 
                                @click=${() => this.goToPage(1)}>
                                «
                            </button>
                            <button 
                                ?disabled=${this.page === 1} 
                                @click=${() => this.goToPage(this.page - 1)}>
                                Poprzednia
                            </button>
                            
                            <button 
                                ?disabled=${this.page === this.totalPages} 
                                @click=${() => this.goToPage(this.page + 1)}>
                                Następna
                            </button>
                            <button 
                                ?disabled=${this.page === this.totalPages} 
                                @click=${() => this.goToPage(this.totalPages)}>
                                »
                            </button>

                            <select .value=${String(this.pageSize)} @change=${this.handlePageSizeChange}>
                                <option value="25">25 na stronę</option>
                                <option value="50">50 na stronę</option>
                                <option value="100">100 na stronę</option>
                                <option value="250">250 na stronę</option>
                            </select>
                        </div>
                    </div>
                `
            }

            render() {
                return html`
                    <table>
                        <thead>
                            <th>Miniatura</th>
                            <th>Kolejność</th>
                            <th>Data polubienia</th>
                            <th>Link</th>
                            <th>Autor</th>
                            <th>Opis</th>
                        </thead>
                        <tbody>
                            ${this.paginatedItems.map(item => {
                                return html`
                                    <tr>
                                        <td>${this.renderThumbnail(item)}</td>
                                        <td>${this.renderOrder(item)}</td>
                                        <td>${this.renderDate(item)}</td>
                                        <td>${this.renderLink(item)}</td>
                                        <td>${this.renderAuthor(item)}</td>
                                        <td>${this.renderDescription(item)}</td>
                                    </tr>
                                `
                            })}
                        </tbody>
                    </table>

                    ${this.renderPagination()}

                    <dialog id="content-dialog" @close=${this.resetItemContent} @cancel=${this.resetItemContent}>
                        ${this.renderDialogContent()}
                    </dialog>
                `
            }

            renderThumbnail(item) {
                if (item.cover && !item.cover.endsWith('undefined')) {
                    return html`
                        <button class="thumbnailButton" command="show-modal" commandfor="content-dialog" @click=${() => this.showItemContent(item)}>
                            <img src="${ROOT_URL + '/cover/' + item.id}" alt="${item.description}" loading="lazy" />
                        </button>
                    `
                } else {
                    return html`<button @click=${() => this.downloadMissingTikTok(item)}>Pobierz</button>`
                }
            }
            
            renderOrder(item) {
                const order = this.items.length - (this.items.findIndex(i => i.id === item.id))
                return html`${order}`
            }

            renderDate(item) {
                if (item.date) {
                    const formattedDate = Intl.DateTimeFormat("pl-PL").format(new Date(item.date))
                    return html`<time datetime=${item.date}>${formattedDate}</time>`
                } else {
                    return ''
                }
            }

            renderLink(item) {
                if (item.fullUrl) {
                    return html`<a href="${item.fullUrl}" target="_blank">${item.fullUrl}</a>`
                } else {
                    return ''
                }
            }

            renderAuthor(item) {
                if (item.username) {
                    return html`<a href="${'https://www.tiktok.com/@' + item.username}" target="_blank">${item.username}</a>`
                } else {
                    return ''
                }
            }

            renderDescription(item) {
                return item.description || ''
            }

            renderDialogContent() {
                if (!this.activeItem) return ''
                return html`
                    ${this.renderDialogMultimedia()}
                    ${this.renderDialogMetadata()}
                `
            }

            renderDialogMultimedia() {
                if (this.activeItem.type === 'video') {
                    return html`
                        <video 
                            src="${ROOT_URL + this.activeItem.content}"
                            controls 
                            autoplay 
                            loop 
                            .volume=${this.savedVolume}
                            @volumechange=${this.handleVolumeChange}>
                        </video>
                    `
                } else {
                    return html`
                        <figure>
                            <img src="${ROOT_URL + '/images/' + this.activeItem.id + "/" + (this.activePhotoIndex + 1)}" />
                            <figcaption>${this.activePhotoIndex + 1} z ${this.activeItem.content.length - 1}</figcaption>
                            <button class="left" @click=${this.showPreviousPhoto}>&#x3c;</button>
                            <button class="right" @click=${this.showNextPhoto}>&#x3e;</button>
                        </figure>
                    `
                }
            }

            renderDialogMetadata() {
                const audioControls = this.activeItem.type === 'photo' && this.activeItem.content.length > 0 ?
                    html`
                        <audio 
                            src="${ROOT_URL + '/audio/' + this.activeItem.id}"
                            controls 
                            autoplay 
                            loop 
                            .volume=${this.savedVolume}
                            @volumechange=${this.handleVolumeChange}>
                        </audio>
                    ` : ''

                return html`
                    <article>
                        <div class="controls">
                            <div>
                                <button @click=${this.showPreviousItem}>↑</button>
                                <button @click=${this.showNextItem}>↓</button>
                            </div>
                            <button class="close" commandfor="content-dialog" command="close">X</button>
                        </div>
                        <dl>
                            <dt>Autor</dt>
                            <dd>${this.renderAuthor(this.activeItem)}</dd>
            
                            <dt>Link</dt>
                            <dd>${this.renderLink(this.activeItem)}</dd>
            
                            <dt>Data polubienia</dt>
                            <dd>${this.renderDate(this.activeItem)}</dd>

                            <dt>Opis</dt>
                            <dd>${this.renderDescription(this.activeItem)}</dd>
                        </dl>
                        ${audioControls}
                    </article>
                `
            }

            showItemContent(item) {
                this.activeItem = item
                this.activeItemIndex = this.items.findIndex(i => i.id === item.id)
                this.activePhotoIndex = 0

                if (this.activeItemIndex !== -1) {
                    const expectedPage = Math.floor(this.activeItemIndex / this.pageSize) + 1
                    if (this.page !== expectedPage) {
                        this.page = expectedPage
                    }
                }
            }

            showPreviousItem() {
                if (this.activeItemIndex > 0) {
                    this.showItemContent(this.items[this.activeItemIndex - 1])
                }
            }

            showNextItem() {
                if (this.activeItemIndex + 1 < this.items.length) {
                    this.showItemContent(this.items[this.activeItemIndex + 1])
                }
            }

            showPreviousPhoto() {
                if (this.activePhotoIndex - 1 === 0) {
                    this.activePhotoIndex = this.activeItem.content.length - 1
                } else {
                    this.activePhotoIndex -= 1
                }
            }

            showNextPhoto() {
                if (this.activePhotoIndex + 1 === this.activeItem.content.length - 1) {
                    this.activePhotoIndex = 0
                } else {
                    this.activePhotoIndex += 1
                }
            }

            resetItemContent(item) {
                this.activeItem = null
                this.activeItemIndex = -1
            }

            downloadMissingTikTok(item) {
                alert('No będzie pobierane', JSON.stringify(item))
            }
        }

        const lastLikeHeading = async () => {
            const res = await fetch(ROOT_URL + '/last-like')
            const lastLike = await res.text()
            
            return html`<h2>Ostatnia modyfikacja: ${lastLike}</h2>`
        } 

        const prepareMainContent = async () => {
            return html`${await lastLikeHeading()} <tiktok-table></tiktok-table>`
        }

        customElements.define('tiktok-table', TikTokTable);
        
        render(await prepareMainContent(), document.querySelector('main'))
    </script>
</body>
</html>
